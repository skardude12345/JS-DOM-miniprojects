<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h3>Job Application</h3>
    <form>
        <div class="form">

            <div class="input-div">
                <p>First Name</p>
                <input id="first-name" placeholder="enter first name">
            </div>
            <div class="input-div">
                <p>Last Name</p>
                <input id="last-name" placeholder="enter last name">
            </div>
            <div class="input-div">
                <p>Email</p>
                <input id="email" placeholder="enter email" type="email">
            </div>
            <div class="input-div">
                <p>Job role</p>
                <select required id="job-role">
                    <option value="" selected disabled hidden>select job role</option>
                    <option>Manager</option>
                    <option>Data analyst</option>
                    <option>Full-Stack Engineer</option>
                    <option>Machine Learning Engineer</option>
                    <option>Graphic Designer</option>
                </select>
            </div>
            <div class="input-div">
                <p>Address</p>
                <input id="address" placeholder="enter address" type="text">
            </div>
            <div class="input-div">
                <p>City Name</p>
                <input id="city" placeholder="enter city name">
            </div>
            <div class="input-div">
                <p>Pincode</p>
                <input id="pincode" placeholder="enter pincode">
            </div>
            <div class="input-div">
                <p>Date</p>
                <input id="date" type="date">
            </div>
            <div class="input-div">
                <p>Upload your CV</p>
                <input id="CV" type="file">
            </div>

            <div class="input-div">
                <input id="submit" type="submit">
            </div>

        </div>
    </form>

    <div id="show">

    </div>

    <script src="script.js"></script>
</body>


</html>
