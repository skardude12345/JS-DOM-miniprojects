<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Marks Management</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Student Marks Management</h1>
    
    <div class="inputs">
        <input placeholder="enter name" id="name">
        <input placeholder="enter english marks" id="english" type="number">
        <input placeholder="enter hindi marks" id="hindi" type="number">
        <input placeholder="enter math marks" id="math" type="number">
        <input placeholder="enter science marks" id="science" type="number">
        <button id="add" onclick="addStudent()">Add</button>
    </div>

    <div class="categories">
        <h2>Name</h2>
        <h2>English</h2>
        <h2>Hindi</h2>
        <h2>Math</h2>
        <h2>Science</h2>
        <h2>Total</h2>
        <h2>Grade</h2>
        <div class="btn-spacer"></div>
    </div>

    <div id="show"></div>

    <script src="script.js"></script>
</body>
</html>
